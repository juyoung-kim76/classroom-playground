<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>낮과 밤 만들기 · 실사 사진 전자칠판 게임</title>
<style>
:root{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:#29334d;font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:#f2f6fb}body{user-select:none;-webkit-user-select:none}button{font:inherit}
.app{width:100%;max-width:2050px;min-height:100dvh;margin:auto;padding:12px clamp(10px,1.8vw,28px) 16px;display:flex;flex-direction:column;gap:11px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:9px}
.brand{display:flex;flex-direction:column;gap:1px}.brand h1{font-size:clamp(25px,2.35vw,39px);letter-spacing:-.065em;margin:0;font-weight:950}.brand p{font-size:clamp(13px,1.08vw,17px);color:#6a7892;margin:0;font-weight:650}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.control{background:white;border:1px solid #d9e2ec;border-radius:14px;min-height:42px;padding:7px 14px;font-weight:850;font-size:clamp(13px,1vw,16px);color:#3c5070;box-shadow:0 3px 7px #344b6a12;cursor:pointer}.control:hover{background:#edf6ff}.control:focus-visible,.photo-card:focus-visible,.placed:focus-visible,.scene:focus-visible{outline:4px solid #ffbc55;outline-offset:2px}
.scenes{flex:1 1 auto;min-height:295px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scene{position:relative;overflow:hidden;isolation:isolate;border:4px solid #fff;border-radius:25px;box-shadow:0 5px 18px #32456326;cursor:pointer;transition:box-shadow .18s,border-color .18s;min-width:0}
.scene::before{content:"";position:absolute;inset:0;z-index:-3;background-size:cover;background-position:center;filter:blur(2px)}
.scene.day::before{background-image:var(--day-photo)}.scene.night::before{background-image:var(--night-photo)}
.scene::after{content:"";position:absolute;inset:0;z-index:-2;transition:background .55s;pointer-events:none}
.scene.day::after{background:rgba(227,234,230,var(--veil,.72))}
.scene.night::after{background:rgba(21,27,58,var(--veil,.84))}
.scene.hover{border-color:#ffd04c;box-shadow:0 0 0 5px #ffcc48,0 6px 24px #41547535}
.scene.wrong{animation:shake .3s ease;border-color:#ff7e88}
@keyframes shake{25%{transform:translateX(-5px)}65%{transform:translateX(5px)}100%{transform:none}}
.scene-caption{position:absolute;left:17px;right:17px;top:15px;display:flex;justify-content:space-between;align-items:center;z-index:4;gap:8px}
.zone-name{background:rgba(255,255,255,.96);border-radius:99px;padding:8px 20px;font-size:clamp(25px,2.35vw,37px);font-weight:1000;box-shadow:0 3px 11px #263d561a;letter-spacing:-.075em}
.day .zone-name{color:#c8820b}.night .zone-name{color:#354caf}
.count{background:#fff;min-width:73px;text-align:center;border-radius:99px;padding:10px 12px;font-size:clamp(17px,1.4vw,23px);font-weight:1000;color:#50617d;box-shadow:0 3px 10px #1721371c}
.drop-hint{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:2;background:#fffffff2;border:2px dashed #8eabbc;padding:16px 22px;border-radius:20px;font-size:clamp(17px,1.4vw,23px);font-weight:900;text-align:center;white-space:nowrap;color:#4c5c70;box-shadow:0 3px 18px #26385020;transition:opacity .25s}
.scene.has-cards .drop-hint{opacity:0;pointer-events:none}
.placed-grid{position:absolute;left:6%;right:6%;top:25%;bottom:13%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;z-index:3;pointer-events:none}
.placed{min-height:0;min-width:0;padding:4px;display:flex;flex-direction:column;border-radius:12px;background:#fff;box-shadow:0 3px 12px #182a4260;border:2px solid #fff;pointer-events:auto;cursor:pointer;animation:pop .22s ease-out;overflow:hidden;position:relative}
.placed img{width:100%;height:100%;flex:1 1 auto;min-height:0;object-fit:cover;border-radius:7px;pointer-events:none}
.placed span{font-weight:900;color:#30394d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:clamp(11px,1vw,16px);line-height:1.2;padding:2px 0 0}
.placed::after{content:"×";position:absolute;right:4px;top:4px;font-size:16px;width:22px;height:22px;display:grid;place-items:center;border-radius:100%;color:#fff;background:#303f62ba;opacity:0}
.placed:hover::after,.placed:focus-visible::after{opacity:1}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.feedback-banner{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#ffffffe8;border-radius:99px;padding:7px 17px;font-size:clamp(13px,1.16vw,18px);font-weight:850;white-space:nowrap;color:#3d4d66;z-index:4;box-shadow:0 2px 10px #2d3e5e20}
.tray{background:white;border-radius:23px;box-shadow:0 3px 18px #3b5c7b16;border:1px solid #e6eef3;padding:11px 13px 13px;flex:0 0 auto}
.tray-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:29px;margin-bottom:8px;flex-wrap:wrap}
.tray-title{font-size:clamp(17px,1.4vw,22px);font-weight:950;letter-spacing:-.06em}
.tray-msg{color:#536985;background:#f1f6fb;padding:5px 10px;border-radius:11px;font-size:clamp(12px,1vw,15px);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.photo-card{min-width:0;min-height:0;padding:5px;display:flex;flex-direction:column;gap:5px;background:#fcfdff;border:2px solid #dce6ef;border-radius:14px;box-shadow:0 3px 0 #e4e9ef;cursor:grab;touch-action:none;transition:transform .15s,opacity .15s,border-color .15s}
.photo-card:hover:not(.done){transform:translateY(-2px);border-color:#bbd7ed}.photo-card:active{cursor:grabbing}.photo-card.selected{border:3px solid #fcb83f;background:#fff9e8;box-shadow:0 0 0 2px #fff0c7}
.photo-card.done{opacity:.24;filter:grayscale(.8);cursor:default;box-shadow:none}
.photo-card img{width:100%;height:clamp(66px,9.2vh,115px);object-fit:cover;border-radius:9px;pointer-events:none;display:block}
.photo-card b{font-size:clamp(13px,1.13vw,18px);font-weight:950;letter-spacing:-.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;text-align:center}
.app.no-labels .photo-card b,.app.no-labels .placed span{display:none}
.drag-ghost{position:fixed;z-index:1000;top:0;left:0;transform:translate(-50%,-65%);width:185px;padding:6px;background:#fff;border:3px solid #ffd165;border-radius:13px;box-shadow:0 12px 28px #0a1a3670;pointer-events:none;opacity:.96;text-align:center}
.drag-ghost img{width:100%;height:105px;object-fit:cover;border-radius:7px}.drag-ghost b{display:block;margin:4px auto;font-size:16px}
.notification{position:fixed;z-index:2000;bottom:30%;left:50%;transform:translateX(-50%) scale(.9);background:#253f65;color:white;padding:15px 24px;border-radius:18px;opacity:0;pointer-events:none;font-size:22px;font-weight:900;transition:opacity .17s,transform .17s;box-shadow:0 8px 28px #1627466a;max-width:95vw;text-align:center}
.notification.show{opacity:1;transform:translateX(-50%) scale(1)}
.finish{position:fixed;z-index:3000;inset:0;background:#142848b9;display:none;align-items:center;justify-content:center;padding:20px}
.finish.show{display:flex}.finish-box{background:white;text-align:center;border-radius:25px;box-shadow:0 12px 45px #10294a80;max-width:510px;width:100%;padding:32px 27px}
.finish-box h2{font-size:clamp(27px,3vw,42px);color:#263f6d;margin:0 0 8px}.finish-box p{font-size:20px;line-height:1.5;color:#596c8b;font-weight:750;margin:0 0 20px}
.finish-box button{border:0;border-radius:13px;background:#2459a1;color:white;padding:12px 29px;font-size:21px;font-weight:850;cursor:pointer}
@media(max-width:1100px){.app{gap:8px}.placed-grid{left:4%;right:4%;gap:5px}.tray{padding:8px}.cards{gap:5px}.photo-card{padding:3px;border-radius:10px;gap:3px}.placed span{font-size:11px}}
@media(max-width:720px){.app{min-height:100vh}.scenes{min-height:270px}.zone-name{font-size:23px}.scene-caption{left:8px;right:8px;top:8px}.count{min-width:56px;font-size:16px;padding:7px}.placed-grid{top:28%;bottom:14%}.placed{padding:2px;border-radius:7px}.feedback-banner{font-size:10px;white-space:normal;text-align:center}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.photo-card img{height:75px}.controls{width:100%}.control{flex:1}}
@media(max-height:780px) and (min-width:721px){.app{padding-top:7px;gap:7px}.brand h1{font-size:28px}.brand p{font-size:12px}.tray{padding:7px 9px}.tray-top{margin-bottom:4px}.photo-card img{height:clamp(53px,8.8vh,88px)}.photo-card{gap:3px}.scenes{min-height:235px}.placed-grid{top:25%;bottom:12%}.zone-name{font-size:23px;padding:6px 13px}.scene-caption{top:9px}.count{font-size:15px;padding:7px}}
</style>
</head>
<body>
<main class="app">
<header>
 <div class="brand"><h1>낮과 밤 만들기</h1><p>생활 사진을 알맞은 시간에 놓아 보세요!</p></div>
 <div class="controls"><button class="control" id="toggleLabel">글씨 숨기기</button><button class="control" id="shuffle">그림 섞기</button><button class="control" id="toggleSound">소리 켜짐</button><button class="control" id="reset">다시하기</button><button class="control" id="fullscreen">전체 화면</button></div>
</header>
<section class="scenes">
 <div class="scene day" id="dayZone" tabindex="0" role="button" aria-label="낮, 낮에 하는 활동을 놓는 곳">
  <div class="scene-caption"><span class="zone-name">낮</span><span class="count" id="dayCount">0 / 7</span></div>
  <div class="drop-hint">낮에 어울리는 사진을 놓아요</div>
  <div class="placed-grid" id="dayGrid"></div><span class="feedback-banner" id="dayFeedback">사진을 놓으면 낮이 밝아져요</span>
 </div>
 <div class="scene night" id="nightZone" tabindex="0" role="button" aria-label="밤, 밤에 하는 활동을 놓는 곳">
  <div class="scene-caption"><span class="zone-name">밤</span><span class="count" id="nightCount">0 / 7</span></div>
  <div class="drop-hint">밤에 어울리는 사진을 놓아요</div>
  <div class="placed-grid" id="nightGrid"></div><span class="feedback-banner" id="nightFeedback">사진을 놓으면 밤이 어두워져요</span>
 </div>
</section>
<section class="tray" id="tray">
 <div class="tray-top"><span class="tray-title">어디에 놓을까요?</span><span class="tray-msg" id="message" aria-live="polite">사진을 끌어서 놓거나, 사진과 낮·밤을 차례대로 눌러 보세요.</span></div>
 <div class="cards" id="cards"></div>
</section>
</main>
<div class="notification" id="toast" role="status"></div>
<div class="finish" id="finish" aria-hidden="true"><div class="finish-box"><h2>낮과 밤 완성!</h2><p>낮에도, 밤에도 하는 일이 있어요.<br>양치하기는 두 곳 모두에서 할 수 있지요.</p><button id="playAgain">한 번 더 하기</button></div></div>

const ITEMS = [{"id": "sun", "label": "해", "kind": "day"}, {"id": "playground", "label": "놀이터에서 놀기", "kind": "day"}, {"id": "school", "label": "등교하기", "kind": "day"}, {"id": "study", "label": "공부하는 아이", "kind": "day"}, {"id": "lunch", "label": "급식 먹기", "kind": "day"}, {"id": "bus", "label": "통학버스", "kind": "day"}, {"id": "brushMorning", "label": "양치하기", "kind": "both"}, {"id": "stars", "label": "별", "kind": "night"}, {"id": "moon", "label": "달", "kind": "night"}, {"id": "blanket", "label": "이불", "kind": "night"}, {"id": "sleep", "label": "잠자는 모습", "kind": "night"}, {"id": "brushEvening", "label": "양치하기", "kind": "both"}, {"id": "reading", "label": "엄마랑 책보기", "kind": "night"}, {"id": "pajamas", "label": "잠옷 입기", "kind": "night"}];
const photo = id => PHOTOS[id];
const $ = x => document.getElementById(x);
const byID = Object.fromEntries(ITEMS.map(a => [a.id,a]));
let placed={day:[],night:[]}, order=[...ITEMS], chosen=null, pointerState=null, lastDrag=0, muted=false, toastTimer=null, audioCtx=null;
const isPlaced=id=>placed.day.includes(id)||placed.night.includes(id);
function tone(hz,when=0){if(muted)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioCtx??=new Audio();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime+when;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.16)}catch(e){}}
function sound(type){if(type==='good'){tone(587);tone(784,.11)}else if(type==='bad'){tone(270)}else{tone(523);tone(659,.13);tone(784,.27)}}
function msg(t,toast=false){$('message').textContent=t;if(toast){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1600)}}
function renderTray(){const wrap=$('cards');wrap.replaceChildren();for(const item of order){const b=document.createElement('button');b.type='button';b.className='photo-card';b.dataset.id=item.id;b.setAttribute('aria-label',item.label+' 사진 선택');b.innerHTML=`<img src="${photo(item.id)}" alt="" draggable="false"><b>${item.label}</b>`;b.addEventListener('pointerdown', startPointer);b.addEventListener('click',()=>{if(isPlaced(item.id)||Date.now()-lastDrag<380)return;chosen=chosen===item.id?null:item.id;markTray();msg(chosen?'선택했어요! 낮이나 밤을 눌러 주세요.':'사진을 선택해 주세요.')});wrap.appendChild(b)}markTray()}
function markTray(){for(const b of $('cards').children){const used=isPlaced(b.dataset.id);b.classList.toggle('selected',chosen===b.dataset.id&&!used);b.classList.toggle('done',used);b.disabled=used;}}
function drawScene(zone){const sc=$(zone+'Zone'),cards=$(zone+'Grid'),ids=placed[zone];sc.style.setProperty('--veil',String(zone==='day'?(0.74-ids.length/7*.66):(0.63-ids.length/7*.57)));sc.classList.toggle('has-cards',ids.length>0);$(zone+'Count').textContent=ids.length+' / 7';cards.replaceChildren();for(const id of ids){const it=byID[id],b=document.createElement('button');b.className='placed';b.type='button';b.title='사진을 다시 아래로 보내기';b.setAttribute('aria-label',it.label+' 다시 아래로 보내기');b.innerHTML=`<img src="${photo(id)}" alt="" draggable="false"><span>${it.label}</span>`;b.addEventListener('click',ev=>{ev.stopPropagation();placed[zone]=placed[zone].filter(x=>x!==id);drawScene(zone);markTray();$('finish').classList.remove('show');$('finish').setAttribute('aria-hidden','true');msg('사진을 아래로 돌려보냈어요.')});cards.appendChild(b)}$(zone+'Feedback').textContent=ids.length===7?(zone==='day'?'환한 낮이 완성되었어요!':'깜깜한 밤이 완성되었어요!'):(zone==='day'?'사진을 놓으면 낮이 밝아져요':'사진을 놓으면 밤이 어두워져요')}
function put(id,zone){if(!id||isPlaced(id))return;const item=byID[id];if(!item||!['day','night'].includes(zone))return;
const full=placed[zone].length>=7;
const duplicateBrush=item.kind==='both'&&placed[zone].some(v=>byID[v].kind==='both');
if(full||duplicateBrush||(item.kind!=='both'&&item.kind!==zone)){
 const el=$(zone+'Zone');el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),350);sound('bad');msg(duplicateBrush?'양치 사진은 낮과 밤에 하나씩 놓아 보세요.':full?'여기는 사진을 모두 놓았어요.':'다른 쪽에 놓아 볼까요?',true);return;
}
placed[zone].push(id);chosen=null;drawScene(zone);markTray();sound('good');msg(item.kind==='both'?'맞아요! 양치하기는 낮에도 밤에도 해요.':`${item.label}, ${zone==='day'?'낮':'밤'}에 어울려요!`);
if(placed.day.length===7||placed.night.length===7){msg(placed[zone].length===7?(zone==='day'?'낮이 완성되었어요!':'밤이 완성되었어요!'):'잘했어요!',true)}
if(placed.day.length+placed.night.length===ITEMS.length){setTimeout(()=>{if(placed.day.length+placed.night.length===ITEMS.length){$('finish').classList.add('show');$('finish').setAttribute('aria-hidden','false');sound('win')}},550)}
}
function placeSelected(zone){if(chosen)put(chosen,zone);else msg('아래에서 사진 한 장을 선택해 주세요.')}
for(const zone of ['day','night']){const sc=$(zone+'Zone');sc.addEventListener('click',()=>placeSelected(zone));sc.addEventListener('keydown',ev=>{if(ev.target===sc&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();placeSelected(zone)}})}
function startPointer(e){if(e.button!==0||isPlaced(e.currentTarget.dataset.id))return;pointerState={id:e.currentTarget.dataset.id,x:e.clientX,y:e.clientY,drag:false,ghost:null,source:e.currentTarget};}
function trackPointer(e){if(!pointerState)return;const p=pointerState;if(!p.drag&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>9){p.drag=true;p.source.classList.add('selected');p.ghost=document.createElement('div');p.ghost.className='drag-ghost';p.ghost.innerHTML=`<img src="${photo(p.id)}" alt=""><b>${byID[p.id].label}</b>`;document.body.appendChild(p.ghost)}if(p.drag){e.preventDefault();p.ghost.style.left=e.clientX+'px';p.ghost.style.top=e.clientY+'px';const zone=zoneAt(e.clientX,e.clientY);for(const z of ['day','night'])$(z+'Zone').classList.toggle('hover',z===zone)}}
function zoneAt(x,y){const el=document.elementFromPoint(x,y);if(!el)return null;const sc=el.closest('.scene');return sc?sc.id==='dayZone'?'day':'night':null;}
function endPointer(e){if(!pointerState)return;const p=pointerState;pointerState=null;if(p.drag){lastDrag=Date.now();const zone=zoneAt(e.clientX,e.clientY);p.ghost?.remove();for(const z of ['day','night'])$(z+'Zone').classList.remove('hover');if(zone)put(p.id,zone);else{p.source.classList.remove('selected');markTray()}}}
window.addEventListener('pointermove',trackPointer,{passive:false});window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',e=>{if(pointerState?.ghost)pointerState.ghost.remove();pointerState=null;for(const z of ['day','night'])$(z+'Zone').classList.remove('hover');markTray()});
function reset(){placed={day:[],night:[]};chosen=null;$('finish').classList.remove('show');$('finish').setAttribute('aria-hidden','true');drawScene('day');drawScene('night');markTray();msg('새로 시작해요! 사진을 끌어다 놓아 보세요.')}
$('reset').addEventListener('click',reset);$('playAgain').addEventListener('click',reset);
$('shuffle').addEventListener('click',()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}renderTray();msg('사진 순서를 섞었어요.')});
$('toggleLabel').addEventListener('click',()=>{const app=document.querySelector('.app');const hidden=app.classList.toggle('no-labels');$('toggleLabel').textContent=hidden?'글씨 보이기':'글씨 숨기기'});
$('toggleSound').addEventListener('click',()=>{muted=!muted;$('toggleSound').textContent=muted?'소리 꺼짐':'소리 켜짐'});
$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen?.()}else{document.documentElement.requestFullscreen?.().catch(()=>{})}});
document.documentElement.style.setProperty('--day-photo',`url("${photo('sun')}")`);
document.documentElement.style.setProperty('--night-photo',`url("${photo('stars')}")`);
renderTray();drawScene('day');drawScene('night');
</script>
