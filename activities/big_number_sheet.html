<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>큰 수를 찾아요! — 랜덤 수 세기 활동지</title>
<style>
:root{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;color:#223042;font-synthesis:none;}
*{box-sizing:border-box}
body{margin:0;background:#edf2f6}
.toolbar{width:min(900px,calc(100% - 30px));margin:18px auto 14px;background:white;border:1px solid #dce4eb;border-radius:15px;box-shadow:0 3px 14px #10233710;padding:15px 20px;display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.toolbar label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#34465a}
.toolbar select{min-height:39px;border:1px solid #bdcad8;border-radius:9px;background:white;font-size:15px;padding:7px 30px 7px 10px;color:#253348;font-family:inherit}
.toolbar button{min-height:39px;padding:8px 14px;border:1px solid #b8cad9;background:white;border-radius:9px;font:700 14px inherit;font-size:14px;cursor:pointer;color:#234258}
.toolbar button.primary{background:#2454b4;border-color:#2454b4;color:white}
.toolbar button:hover{filter:brightness(.97)}
.toolbar .hint{margin:0 0 3px auto;font-size:12px;color:#627183;max-width:235px;line-height:1.55}
.sheet{width:210mm;min-height:297mm;background:white;margin:0 auto 22px;padding:13mm 14mm 12mm;box-shadow:0 7px 25px #20344a20;display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #2b4257;padding:0 0 3.8mm}
.kicker{font-size:12px;font-weight:800;color:#5281a5;letter-spacing:.08em;margin-bottom:3px}
h1{margin:0;font-size:28px;letter-spacing:-1.3px;line-height:1.25;color:#1c3246}
.name{white-space:nowrap;align-self:flex-end;font-size:16px;font-weight:700;color:#2c4050;margin-bottom:4px}
.name .under{display:inline-block;width:35mm;border-bottom:1.6px solid #657586;height:8mm;vertical-align:bottom}
.guide{margin:6mm 0 5mm;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#2b4051}
.guide .circle{width:29px;height:29px;border:2px solid #3f7795;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#3f7795;flex:none}
.problems{display:flex;flex:1;flex-direction:column;gap:4.5mm}
.problem{position:relative;border:1.8px solid #647a8b;border-radius:10px;display:grid;grid-template-columns:minmax(0,1fr) 52mm;padding:3mm 3mm 3mm 9mm;align-items:stretch;flex:1;min-height:0;break-inside:avoid}
.index{position:absolute;left:-3mm;top:-3mm;background:white;border:1.7px solid #647a8b;color:#304459;border-radius:50%;font-weight:800;font-size:16px;width:10mm;height:10mm;display:flex;align-items:center;justify-content:center}
.picture{min-width:0;display:grid;grid-template-rows:1fr 1fr;border:1.3px solid #b3c4cf;background:#fbfdff;border-radius:8px;overflow:hidden}
.picture-set{display:flex;align-items:center;justify-content:center;gap:1.8mm;min-height:0;padding:1.1mm 2mm;white-space:nowrap}
.picture-set:first-child{border-bottom:1px dashed #c0ccd5}
.picture-set svg{width:var(--iconSize);height:var(--iconSize);flex:none;overflow:visible}
.answers{display:grid;grid-template-rows:1fr 1fr;padding-left:3mm;min-width:0}
.option{display:flex;align-items:center;justify-content:center;gap:3mm;position:relative}
.option svg{width:16mm;height:16mm;flex:none}
.colon{font-size:20px;color:#697b89;font-weight:700}
.number{width:15mm;height:15mm;border:1.5px solid #697e8f;border-radius:5px;display:flex;align-items:center;justify-content:center;font:800 27px/1 sans-serif;position:relative;color:#273947}
.option.correct.reveal .number::after{content:"";position:absolute;inset:-2mm;border:2.4px solid #d44949;border-radius:50%;transform:rotate(-11deg)}
.footer{margin-top:4mm;display:flex;justify-content:space-between;align-items:center;color:#72808c;font-size:10px}
.footer .bottom-tip{font-size:11px;color:#526879}
.sheet.four .guide{margin:3.5mm 0 3mm}
.sheet.four .problems{gap:3.2mm}
.sheet.four .problem{padding-top:2mm;padding-bottom:2mm}
.sheet.four .picture-set svg{width:var(--iconSize);height:var(--iconSize)}
.sheet.four .option svg{width:12.5mm;height:12.5mm}
.sheet.four .number{width:13mm;height:13mm;font-size:23px}
.sheet.four .footer{margin-top:3mm}
@media (max-width:850px){.sheet{transform-origin:top center;width:210mm;max-width:none}.toolbar{width:calc(100% - 18px);margin:9px auto}.toolbar .hint{flex-basis:100%;max-width:none;margin:0}}
@page{size:A4 portrait;margin:0}
@media print{
html,body{width:210mm;height:auto;background:white!important;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.toolbar{display:none!important}
.sheet{width:210mm;height:297mm;min-height:297mm;max-height:297mm;margin:0;padding:13mm 14mm 12mm;box-shadow:none;overflow:hidden;page-break-after:avoid;break-after:avoid}
.option.correct.reveal .number::after{display:none!important}
}
</style>
</head>
<body>

<div class="toolbar" role="group" aria-label="활동지 설정">
  <label>수의 범위
    <select id="maxNum" aria-label="수의 범위"><option value="5">1~5</option><option value="10">1~10</option></select>
  </label>
  <label>한 장의 문제 수
    <select id="qCount" aria-label="한 장의 문제 수"><option value="3">3문제 (큰 그림)</option><option value="4">4문제</option></select>
  </label>
  <button class="primary" id="randomBtn" type="button">↻ 새 문제 만들기</button>
  <button id="printBtn" type="button">🖨 인쇄 / PDF 저장</button>
  <button id="answerBtn" type="button" aria-pressed="false">정답 확인</button>
  <p class="hint">인터넷 없이 작동합니다. 새 문제를 누르면 그림 개수와 정답 위치가 바뀝니다.</p>
</div>
<main class="sheet" id="sheet">
  <div class="sheet-head">
    <div><div class="kicker">수학 · 수의 크기 비교하기</div><h1>큰 수를 찾아요!</h1></div>
    <div class="name">이름 <span class="under"></span></div>
  </div>
  <div class="guide"><span class="circle">✓</span><span>하나씩 짝지어 보고, 더 큰 수에 <strong>◯</strong>표 하세요.</span></div>
  <div class="problems" id="problems"></div>
  <div class="footer"><span class="bottom-tip">그림을 세어 보며 큰 수를 찾아보아요.</span><span>랜덤 수 세기 활동지</span></div>
</main>
<script>
(function(){
 'use strict';
 const themes=[
  {first:'squirrel',second:'acorn',label1:'다람쥐',label2:'도토리'},
  {first:'monkey',second:'banana',label1:'원숭이',label2:'바나나'},
  {first:'chick',second:'egg',label1:'병아리',label2:'달걀'},
  {first:'bunny',second:'carrot',label1:'토끼',label2:'당근'},
  {first:'ladybug',second:'leaf',label1:'무당벌레',label2:'나뭇잎'},
  {first:'butterfly',second:'flower',label1:'나비',label2:'꽃'}
 ];
 const el=id=>document.getElementById(id),problems=el('problems');
 let showingAnswers=false;
 function randInt(n){return Math.floor(Math.random()*n)+1}
 function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
 function icon(id){return '<svg aria-hidden="true" focusable="false" viewBox="0 0 100 100"><use href="#'+id+'" xlink:href="#'+id+'"></use></svg>'}
 function iconLine(id,count,label){return '<div class="picture-set" role="img" aria-label="'+label+' '+count+'개">'+Array.from({length:count},()=>icon(id)).join('')+'</div>'}
 function option(id,count,isCorrect){return '<div class="option'+(isCorrect?' correct':'')+'">'+icon(id)+'<span class="colon">:</span><span class="number">'+count+'</span></div>'}
 function create(){
  const max=Number(el('maxNum').value),n=Number(el('qCount').value);
  const sheet=el('sheet');sheet.classList.toggle('four',n===4);
  const chosen=shuffle(themes.slice()).slice(0,n);
  const winners=shuffle(Array.from({length:n},(_,i)=>i%2===0));
  const smallRange=max===5;
  let html='';
  chosen.forEach((theme,index)=>{
   let a=randInt(max),b=randInt(max);
   while(b===a)b=randInt(max);
   if((a>b)!==winners[index]) [a,b]=[b,a];
   const iconSize=max===5?(n===4? '13.5mm':'16.2mm'):(n===4?'8.8mm':'10.15mm');
   html+='<section class="problem" style="--iconSize:'+iconSize+'">'+
     '<span class="index">'+(index+1)+'</span>'+
     '<div class="picture">'+iconLine(theme.first,a,theme.label1)+iconLine(theme.second,b,theme.label2)+'</div>'+
     '<div class="answers">'+option(theme.first,a,a>b)+option(theme.second,b,b>a)+'</div></section>';
  });
  problems.innerHTML=html;
  showingAnswers=false;el('answerBtn').textContent='정답 확인';el('answerBtn').setAttribute('aria-pressed','false');
  document.querySelectorAll('.option').forEach(x=>x.classList.remove('reveal'));
 }
 window.makeNewWorksheet=create;
 el('randomBtn').addEventListener('click',create);
 el('maxNum').addEventListener('change',create);
 el('qCount').addEventListener('change',create);
 el('printBtn').addEventListener('click',()=>window.print());
 el('answerBtn').addEventListener('click',()=>{
  showingAnswers=!showingAnswers;
  document.querySelectorAll('.option.correct').forEach(x=>x.classList.toggle('reveal',showingAnswers));
  el('answerBtn').textContent=showingAnswers?'정답 숨기기':'정답 확인';
  el('answerBtn').setAttribute('aria-pressed',String(showingAnswers));
 });
 create();
})();
</script>
</body>
</html>
