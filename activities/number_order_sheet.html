<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>수의 순서 자동 생성 활동지</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1e6;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#1e2928}.toolbar{position:sticky;top:0;z-index:5;background:white;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;box-shadow:0 2px 10px #0002}.toolbar label{font-size:14px;font-weight:700}.toolbar select,.toolbar button{font:inherit;padding:8px 12px;border:1px solid #a2ad83;border-radius:8px;background:white}.toolbar button{cursor:pointer;background:#8da91f;color:white;font-weight:700;border:0}.toolbar button.secondary{background:#465d63}.hint{font-size:12px;color:#59645b;text-align:center;margin:7px}.page{width:210mm;min-height:297mm;margin:18px auto;background:#f4f7c1;padding:13mm 12mm;box-shadow:0 5px 22px #0002;position:relative}.banner{background:#bbcd38;color:white;text-align:center;font-size:32px;font-weight:900;letter-spacing:-1px;padding:12px;border-radius:50% 14% 40% 10% / 17% 28% 20% 25%;transform:rotate(-1deg)}.name{margin:10px auto 10px;width:65%;border:3px dotted #e5b06f;border-radius:22px;background:white;padding:13px;font-size:17px;font-weight:700}.main{border-radius:25px;background:white;padding:13px 15px 30px;min-height:212mm}.section{background:#a9b71c;color:white;font-size:16px;padding:11px 18px;border-radius:18px;font-weight:700}.instruction{text-align:center;margin:15px 0 4px;font-weight:700;font-size:16px}.reference{width:100%;height:78px;display:block;margin:0 auto 20px}.questions{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:9px 0}.question{border:2.5px solid #eac482;border-radius:10px;height:116px;padding:9px 5px;position:relative}.qnum{position:absolute;top:4px;left:8px;font-size:11px;color:#b1a36f}.question svg{width:100%;height:100%}.foot{text-align:center;font-size:11px;color:#7c8466;position:absolute;bottom:8mm;left:0;right:0}.answer .blanktext{font-size:26px;fill:#bc7a34}.answer{display:none}body.showanswers .answer{display:block}body.showanswers .blankcircle{display:none}@media(max-width:850px){.page{width:100%;min-height:0;padding:20px}.main{min-height:0}.banner{font-size:27px}.question{height:100px}}@media print{@page{size:A4;margin:0}body{background:white}.toolbar,.hint{display:none}.page{box-shadow:none;margin:0;width:210mm;height:297mm;min-height:297mm;break-after:page;padding:13mm 12mm}.page:last-child{break-after:auto}.main{min-height:212mm}.banner{print-color-adjust:exact;-webkit-print-color-adjust:exact}.section,.page{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="toolbar"><label>숫자 범위 <select id="range"><option value="10" selected>0~10</option><option value="5">0~5</option><option value="20">0~20</option></select></label><label>인쇄 매수 <select id="count"><option value="1">1장</option><option value="3">3장</option><option value="5" selected>5장</option><option value="10">10장</option></select></label><button id="generate">↻ 새 문제 만들기</button><button class="secondary" id="print">인쇄 / PDF 저장</button><button class="secondary" id="answers">정답 보기</button></div><p class="hint">문제 6개씩 · 연속된 숫자 4개 중 하나를 비워 둡니다 · 새 문제 만들기를 누를 때마다 다시 무작위로 생성됩니다 · 인터넷 연결 불필요</p><div id="pages"></div><script>
const $=id=>document.getElementById(id);let showAnswers=false;const choice=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=choice(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function makeProblems(max){let combinations=[];for(let start=0;start<=max-3;start++)for(let missing=0;missing<4;missing++)combinations.push({start,missing});return shuffle(combinations).slice(0,6)}
function refLine(max){
  const left=25,right=625,step=(right-left)/max;
  const fontSize=max===20?15:22;
  let out='<svg class="reference" viewBox="0 0 650 78" preserveAspectRatio="xMidYMid meet"><line x1="'+left+'" y1="26" x2="628" y2="26" stroke="black" stroke-width="3"/><polygon points="628,20 644,26 628,32" fill="black"/>';
  for(let i=0;i<=max;i++){
    let x=left+i*step;
    out+=`<line x1="${x}" y1="7" x2="${x}" y2="28" stroke="black" stroke-width="${max===20?2:3}"/><text x="${x}" y="57" font-size="${fontSize}" font-weight="bold" text-anchor="middle">${i}</text>`;
  }
  return out+'</svg>';
}
function questionSvg(p){let s='<svg viewBox="0 0 310 96" preserveAspectRatio="xMidYMid meet"><line x1="16" y1="31" x2="294" y2="31" stroke="black" stroke-width="3.5"/>';for(let i=0;i<4;i++){let x=52+i*68;s+=`<line x1="${x}" y1="9" x2="${x}" y2="50" stroke="black" stroke-width="3.5"/>`;if(i===p.missing){s+=`<circle class="blankcircle" cx="${x}" cy="73" r="20" fill="white" stroke="black" stroke-width="2.8"/><g class="answer"><text class="blanktext" x="${x}" y="84" font-weight="bold" text-anchor="middle">${p.start+i}</text></g>`}else{s+=`<text x="${x}" y="84" font-size="28" font-weight="bold" text-anchor="middle">${p.start+i}</text>`}}return s+'</svg>'}
function build(){let count=+$('count').value,max=+$('range').value,el=$('pages');el.innerHTML='';for(let k=0;k<count;k++){let page=document.createElement('div');page.className='page';let problems=makeProblems(max);page.innerHTML=`<div class="banner">수의 순서를 알아봅시다</div><div class="name">이름: </div><div class="main"><div class="section">1. 수의 순서</div><div class="instruction">빈 동그라미에 알맞은 숫자를 써 보세요.</div>${refLine(max)}<div class="questions">${problems.map((p,i)=>`<div class="question"><span class="qnum">${i+1}</span>${questionSvg(p)}</div>`).join('')}</div></div><div class="foot">수의 순서 · ${k+1} / ${count}</div>`;el.appendChild(page)}}
$('generate').onclick=build;$('count').onchange=build;$('range').onchange=build;$('print').onclick=()=>window.print();$('answers').onclick=()=>{showAnswers=!showAnswers;document.body.classList.toggle('showanswers',showAnswers);$('answers').textContent=showAnswers?'정답 숨기기':'정답 보기'};build();
</script></body></html>
