<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나뭇잎 배 놀이</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',system-ui,sans-serif;background:#f4fbfa;color:#315c65;overflow:hidden;user-select:none}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:12px 25px}h1{margin:0;font-size:clamp(23px,3vw,34px)}button{font:inherit;cursor:pointer}header button{border:2px solid #c5dedc;background:#fff;color:#315c65;padding:10px 18px;border-radius:13px;font-weight:800}.instruction{height:40px;text-align:center;font-weight:900;font-size:24px}.workspace{height:calc(100dvh - 214px);padding:5px 3vw 0;display:flex;align-items:center;justify-content:center}.pond{width:min(900px,100%);height:100%;border:14px solid #96c8d4;border-radius:48% / 31%;background:radial-gradient(ellipse at 40% 30%,#d1f7ff 4%,#a0dfec 65%,#78c5db 100%);box-shadow:inset 0 0 28px #5ab5ce4a,0 12px 0 #c5e7eb;position:relative;overflow:hidden}.pond:before,.pond:after{content:"";position:absolute;border:3px solid #ffffff7a;border-radius:50%;width:120px;height:36px;left:12%;top:18%;transform:rotate(-9deg)}.pond:after{left:auto;right:10%;top:70%;width:170px}.floating{position:absolute;transform:translate(-50%,-50%);width:clamp(77px,11vw,134px);height:clamp(77px,11vw,134px);pointer-events:none;animation:bob 2.6s ease-in-out infinite alternate}.floating:nth-child(even){animation-delay:-1.2s}@keyframes bob{from{translate:0 -6px;rotate:-6deg}to{translate:0 7px;rotate:5deg}}.leafsvg{width:100%;height:100%;filter:drop-shadow(0 5px 3px #407c8850)}.tray{height:96px;display:flex;justify-content:center;align-items:center;gap:20px;padding:5px}.leafbtn{width:90px;height:80px;border:3px solid #d5e7d6;border-radius:20px;background:#fff;touch-action:none}.leafbtn svg{height:65px;width:75px}.foottext{font-size:15px;color:#728d8d;text-align:center}.ghost{position:fixed;pointer-events:none;width:90px;height:90px;z-index:9;opacity:.85} @media(max-height:550px){header{height:58px}.workspace{height:calc(100dvh - 159px)}.instruction{height:30px}.tray{height:70px}.leafbtn{height:63px;width:70px}.leafbtn svg{height:48px}}
</style></head><body><header><h1>🍃 나뭇잎 배 놀이</h1><button id="clear">다시 하기 ↻</button></header><div class="instruction">나뭇잎을 물에 띄워요!</div><div class="workspace"><div class="pond" id="pond" aria-label="나뭇잎을 띄우는 물"></div></div><div class="tray" id="tray"></div><div class="foottext">나뭇잎을 끌어서 물 위에 놓아요</div><script>
const shapes=[['#78b87d',0],['#e4b36b',1],['#9bc975',2]];const pond=document.getElementById('pond');const tray=document.getElementById('tray');let ghost=null,dragging=null,justDragged=false;
function leaf(color,type){let p=type===0?'M20 76 Q8 20 70 11 Q94 66 20 76':type===1?'M14 60 Q25 16 73 19 Q84 65 14 60':'M18 82 Q18 24 60 12 Q98 42 18 82';return `<svg class="leafsvg" viewBox="0 0 100 100" aria-hidden="true"><path d="${p}" fill="${color}" stroke="#547d57" stroke-width="3"/><path d="M17 84L65 29M45 51l-8-18M46 49l18 5" fill="none" stroke="#5e8c5e" stroke-width="3" stroke-linecap="round"/></svg>`}
function add(color,type,x,y){const r=pond.getBoundingClientRect();const el=document.createElement('div');el.className='floating';el.style.left=Math.max(11,Math.min(89,((x-r.left)/r.width)*100))+'%';el.style.top=Math.max(17,Math.min(83,((y-r.top)/r.height)*100))+'%';el.innerHTML=leaf(color,type);pond.append(el)}
shapes.forEach(([color,type])=>{const b=document.createElement('button');b.className='leafbtn';b.type='button';b.setAttribute('aria-label','나뭇잎 물에 띄우기');b.innerHTML=leaf(color,type);tray.append(b);let down=null;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY};dragging={color,type};ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=leaf(color,type);document.body.append(ghost);move(e)});function move(e){if(ghost){ghost.style.left=(e.clientX-45)+'px';ghost.style.top=(e.clientY-45)+'px'}}b.addEventListener('pointermove',move);b.addEventListener('pointerup',e=>{if(!dragging)return;const r=pond.getBoundingClientRect();const inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;add(color,type,inside?e.clientX:r.left+r.width*(.25+Math.random()*.5),inside?e.clientY:r.top+r.height*(.3+Math.random()*.4));ghost?.remove();ghost=null;dragging=null});b.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;dragging=null})});
document.getElementById('clear').addEventListener('click',()=>pond.querySelectorAll('.floating').forEach(x=>x.remove()));
</script></body></html>
