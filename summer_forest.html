<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실 속 여름 숲</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',system-ui,sans-serif;background:#f6fbf4;color:#335b43;overflow:hidden;user-select:none}header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px 22px}header h1{margin:0;font-size:clamp(24px,3vw,36px)}button{font:inherit;cursor:pointer}.reset{border:2px solid #b9d4bb;background:white;padding:10px 17px;border-radius:14px;font-weight:800}.info{text-align:center;font-size:22px;font-weight:900;height:37px}.scene{height:calc(100dvh - 214px);margin:0 3vw;border:8px solid #d0dfbc;border-radius:32px;background:linear-gradient(#e3f6ff 0%,#d6edf5 58%,#c9dfaf 59%,#add08b 100%);position:relative;overflow:hidden;touch-action:none}.scene:before{content:'';position:absolute;width:100px;height:100px;border-radius:50%;right:8%;top:7%;background:#ffda6f;box-shadow:0 0 0 15px #ffecbd6d}.piece{position:absolute;transform:translate(-50%,-50%);width:clamp(72px,12vw,134px);height:clamp(72px,12vw,134px);touch-action:none;cursor:grab}.piece svg,.item svg{width:100%;height:100%;filter:drop-shadow(0 4px 4px #2d46352c)}.tray{height:100px;display:flex;justify-content:center;align-items:center;gap:16px}.item{border:3px solid #d5e5d2;background:#fff;border-radius:20px;width:105px;height:85px;padding:9px;touch-action:none}.hint{text-align:center;color:#829980;font-size:14px}@media(max-height:540px){header{height:53px}.info{height:27px;font-size:18px}.scene{height:calc(100dvh - 151px)}.tray{height:64px}.item{height:57px;width:70px;padding:4px}}
</style></head><body><header><h1>🌳 교실 속 여름 숲</h1><button class="reset" id="reset">다시 꾸미기 ↻</button></header><div class="info">자연물로 숲을 꾸며요!</div><div class="scene" id="scene"></div><div class="tray" id="tray"></div><div class="hint">아래 자연물을 끌어 숲에 놓아요</div><script>
const arts={twig:'<path d="M50 90L48 18M48 56L18 30M50 44L77 22" fill="none" stroke="#85664c" stroke-width="11" stroke-linecap="round"/><path d="M48 16l6 9" stroke="#ac8765" stroke-width="4"/>',leaf:'<path d="M16 70Q8 15 85 16Q83 83 16 70" fill="#85c88c" stroke="#498c57" stroke-width="4"/><path d="M13 85L71 31M37 62l-7-22M45 56l22 3" stroke="#4c9b5a" stroke-width="4" fill="none"/>',rock:'<path d="M9 70Q11 35 36 26Q72 15 90 58L78 85H25Z" fill="#b5ada2" stroke="#918980" stroke-width="4"/><path d="M24 63Q29 40 48 38" stroke="#d8d2c8" stroke-width="6" fill="none"/>',flower:'<path d="M50 95V53" stroke="#5a9d61" stroke-width="7"/><path d="M49 73Q29 51 24 74Q35 85 49 73" fill="#83c78c"/><g fill="#f3a8bd" stroke="#d97796" stroke-width="2"><ellipse cx="50" cy="32" rx="13" ry="21"/><ellipse cx="50" cy="32" rx="13" ry="21" transform="rotate(72 50 49)"/><ellipse cx="50" cy="32" rx="13" ry="21" transform="rotate(144 50 49)"/><ellipse cx="50" cy="32" rx="13" ry="21" transform="rotate(216 50 49)"/><ellipse cx="50" cy="32" rx="13" ry="21" transform="rotate(288 50 49)"/></g><circle cx="50" cy="49" r="12" fill="#ffd17d"/>'};
const scene=document.getElementById('scene'),tray=document.getElementById('tray');function svg(type){return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${arts[type]}</svg>`}let count=0;
function place(type,x,y){const r=scene.getBoundingClientRect(),el=document.createElement('div');el.className='piece';el.innerHTML=svg(type);el.style.left=Math.max(7,Math.min(93,(x-r.left)/r.width*100))+'%';el.style.top=Math.max(20,Math.min(88,(y-r.top)/r.height*100))+'%';scene.append(el);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const n=scene.getBoundingClientRect();el.style.left=Math.max(7,Math.min(93,(e.clientX-n.left)/n.width*100))+'%';el.style.top=Math.max(15,Math.min(90,(e.clientY-n.top)/n.height*100))+'%'})}
['twig','leaf','rock','flower'].forEach(type=>{const b=document.createElement('button');b.className='item';b.type='button';b.setAttribute('aria-label',{'twig':'나뭇가지','leaf':'나뭇잎','rock':'돌멩이','flower':'꽃'}[type]);b.innerHTML=svg(type);tray.append(b);let ghost=null;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);ghost=document.createElement('div');ghost.className='piece';ghost.style.position='fixed';ghost.style.pointerEvents='none';ghost.innerHTML=svg(type);document.body.append(ghost);move(e)});function move(e){if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}}b.addEventListener('pointermove',move);b.addEventListener('pointerup',e=>{const r=scene.getBoundingClientRect(),x=e.clientX>r.left&&e.clientX<r.right?e.clientX:r.left+r.width*(.2+Math.random()*.6),y=e.clientY>r.top&&e.clientY<r.bottom?e.clientY:r.top+r.height*(.42+Math.random()*.4);place(type,x,y);ghost?.remove();ghost=null});b.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null})});document.getElementById('reset').addEventListener('click',()=>scene.querySelectorAll('.piece').forEach(el=>el.remove()));
</script></body></html>
