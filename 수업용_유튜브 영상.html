<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>수업용 유튜브 영상</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f1f7fb;color:#193b57}body{display:grid;place-items:center;padding:24px}.panel{width:min(690px,100%);background:#fff;border-radius:26px;padding:clamp(25px,5vw,50px);text-align:center;box-shadow:0 18px 45px #24507017}h1{font-size:clamp(27px,4vw,38px);margin:20px 0 12px}.symbol{width:100px;height:100px;border-radius:25px;margin:auto;background:#ec333d;color:white;display:grid;place-items:center;font-size:50px}p{color:#536d80;font-size:17px;line-height:1.7}.go{display:block;text-decoration:none;background:#176aa3;color:#fff;font-weight:800;font-size:24px;padding:21px;margin-top:23px;border-radius:15px}.go:focus-visible{outline:4px solid #ffbf47}.small{font-size:14px;margin-top:20px}
</style>
</head>
<body>
<main class="panel">
<div class="symbol" aria-hidden="true">▶</div>
<h1>수업용 유튜브 영상</h1>
<p>버튼을 누르면 유튜브에서 영상이 열립니다.</p>
<a class="go" href="https://www.youtube.com/watch?v=6ZUVT8eXQJI" target="_blank" rel="noopener noreferrer">▶ 영상 재생하기</a>
<p class="small">우리 반 학습 놀이터로 돌아오려면 유튜브 창을 닫으세요.</p>
</main>
</body>
</html>
