<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>반쪽 그림을 찾아요</title>
<style>
:root{--ink:#243a60;--blue:#2c76db;--outline:#a6c8f7;--shadow:0 6px 18px rgba(44,80,125,.13)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f9ff;color:var(--ink)}
#game{height:100dvh;width:100vw;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 92%,#eaf4ff 0,#f7fbff 70%)}
header{position:absolute;top:1%;left:2%;right:2%;height:7%;display:flex;justify-content:space-between;align-items:center;z-index:2;pointer-events:none}
#counter{font-size:clamp(18px,2.2vw,29px);font-weight:800;color:#647996;letter-spacing:.08em}
.nav{display:flex;gap:9px;pointer-events:auto}.nav button{height:clamp(42px,5vh,64px);width:clamp(52px,5.5vw,76px);border:2px solid #d9e7fb;border-radius:18px;background:white;box-shadow:var(--shadow);font-size:clamp(21px,2.3vw,32px);color:#3975cb;cursor:pointer;touch-action:manipulation}
#work{position:absolute;left:50%;transform:translateX(-50%);bottom:34%;height:42%;width:min(47vw,560px);min-width:min(88vw,340px);border:3px solid #c9dff9;background:#fff;border-radius:27px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
#work::before{content:"";position:absolute;inset:10px;border:3px dashed transparent;border-radius:18px;pointer-events:none}
#work.ready{border-color:#55b98d;box-shadow:0 0 0 10px rgba(84,197,135,.15),var(--shadow)}
#assembly{height:100%;width:100%;display:block}
#choices{position:absolute;bottom:1.5%;left:3%;right:3%;height:29%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,1.9vw,26px)}
.choice{position:relative;display:flex;align-items:center;justify-content:center;background:white;border:3px solid #c7dcf9;border-radius:24px;box-shadow:var(--shadow);overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.choice.active{border:6px solid #4d9bf0;background:#eff7ff}
.choice canvas{display:block;width:100%;height:100%;pointer-events:none}
#dragGhost{position:fixed;left:0;top:0;display:none;z-index:30;pointer-events:none;border-radius:24px;border:3px solid #7aaff7;background:#fff;box-shadow:0 15px 32px rgba(34,70,116,.22)}
#dragGhost canvas{width:100%;height:100%;display:block}
#good{position:absolute;z-index:12;top:4%;left:50%;transform:translateX(-50%) scale(.8);opacity:0;font-size:clamp(44px,5vw,66px);color:#30a868;text-shadow:0 3px 0 #fff;pointer-events:none;transition:opacity .2s, transform .2s}
#good.show{opacity:1;transform:translateX(-50%) scale(1.1)}
#end{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(247,251,255,.94)}
#end.show{display:flex}#end .emoji{font-size:clamp(78px,10vw,132px)}#again{font-size:clamp(22px,2.5vw,38px);background:#fff;color:#3176d0;border:2px solid #d5e7fc;border-radius:22px;padding:13px 32px;box-shadow:var(--shadow);font-weight:800;cursor:pointer}
@media (max-height:680px){#work{height:42%;bottom:34%;width:min(42vw,430px)}#choices{height:29%}}
@media (orientation:portrait){#work{width:min(80vw,500px);height:38%;bottom:39%}#choices{height:32%;bottom:2%;left:2%;right:2%;gap:8px}.choice{border-radius:17px}}
</style></head><body>
<div id="game">
<header><div id="counter">1 / 16</div><div class="nav"><button id="prev" title="이전" aria-label="이전">◀</button><button id="next" title="다음" aria-label="다음">▶</button></div></header>
<section id="work" aria-label="반쪽 그림을 완성하는 곳"><canvas id="assembly" width="600" height="600"></canvas><div id="good">★</div></section>
<section id="choices" aria-label="고를 반쪽 그림 조각"></section>
<div id="dragGhost"><canvas width="600" height="440"></canvas></div>
<div id="end"><div class="emoji">🎉</div><button id="again">다시</button></div>
</div>

const LESSONS = [{"key": "car", "cut": "vertical"}, {"key": "icecream", "cut": "horizontal"}, {"key": "butterfly", "cut": "vertical"}, {"key": "mushroom", "cut": "horizontal"}, {"key": "fish", "cut": "vertical"}, {"key": "apple", "cut": "horizontal"}, {"key": "flower", "cut": "vertical"}, {"key": "tree", "cut": "horizontal"}, {"key": "car", "cut": "horizontal"}, {"key": "icecream", "cut": "vertical"}, {"key": "butterfly", "cut": "horizontal"}, {"key": "mushroom", "cut": "vertical"}, {"key": "fish", "cut": "horizontal"}, {"key": "apple", "cut": "vertical"}, {"key": "flower", "cut": "horizontal"}, {"key": "tree", "cut": "vertical"}];
const imgs = {};
let index = 0, options=[], selected=null, dragging=null, success=false, transitionTimer=null;
const cnv=document.getElementById('assembly'),zone=document.getElementById('work'),row=document.getElementById('choices'),ghost=document.getElementById('dragGhost');
const ctx=cnv.getContext('2d');
const good=document.getElementById('good'),end=document.getElementById('end');
const canvasW=600,canvasH=600;
function fisherYates(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Every half is drawn from the source image pixel rectangle. No CSS clipping/transforms.
function cropInfo(img,cut,missing){const vertical=cut==='vertical';const w=img.naturalWidth,h=img.naturalHeight;
  return vertical?{sx:missing?w/2:0,sy:0,sw:w/2,sh:h}:{sx:0,sy:missing?h/2:0,sw:w,sh:h/2};}
function drawPiece(canvas,img,cut,missing){
 const c=canvas.getContext('2d'),W=canvas.width,H=canvas.height;c.clearRect(0,0,W,H);
 if(!img||!img.complete||!img.naturalWidth)return;
 const {sx,sy,sw,sh}=cropInfo(img,cut,missing);
 const inset=17,scale=Math.min((W-inset*2)/sw,(H-inset*2)/sh);
 const dw=sw*scale,dh=sh*scale,dx=(W-dw)/2,dy=(H-dh)/2;
 c.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
}
function pictureBox(){return {x:56,y:47,s:488};}
function drawAssembly(complete=false){
 const {x,y,s}=pictureBox(),p=LESSONS[index],image=imgs[p.key];ctx.clearRect(0,0,600,600);
 if(!image||!image.complete)return;
 const vertical=p.cut==='vertical';
 ctx.save();ctx.fillStyle='#f0f7ff';ctx.strokeStyle='#a8caf5';ctx.lineWidth=4;ctx.setLineDash([12,11]);
 if(vertical){ctx.fillRect(x+s/2,y,s/2,s);ctx.strokeRect(x+s/2+3,y+3,s/2-6,s-6);}else{ctx.fillRect(x,y+s/2,s,s/2);ctx.strokeRect(x+3,y+s/2+3,s-6,s/2-6);}ctx.restore();
 if(complete){ctx.clearRect(0,0,600,600);ctx.drawImage(image,x,y,s,s);}else{
  ctx.save();ctx.beginPath();
  if(vertical)ctx.rect(x,y,s/2,s);else ctx.rect(x,y,s,s/2);
  ctx.clip();ctx.drawImage(image,x,y,s,s);ctx.restore();
  ctx.save();ctx.strokeStyle='#5b95d7';ctx.lineWidth=3;ctx.setLineDash([8,9]);
  ctx.beginPath();if(vertical){ctx.moveTo(x+s/2,y);ctx.lineTo(x+s/2,y+s);}else{ctx.moveTo(x,y+s/2);ctx.lineTo(x+s,y+s/2);}ctx.stroke();ctx.restore();
 }
}
function createOptions(){
 const p=LESSONS[index],others=fisherYates(Object.keys(imgs).filter(k=>k!==p.key)).slice(0,2);
 options=fisherYates([p.key,...others]);row.textContent='';
 options.forEach((key,choiceIndex)=>{
  const card=document.createElement('div');card.className='choice';card.dataset.key=key;card.setAttribute('role','button');card.setAttribute('aria-label','반쪽 조각 '+(choiceIndex+1));
  const c=document.createElement('canvas');c.width=420;c.height=330;card.appendChild(c);row.appendChild(card);
  drawPiece(c,imgs[key],p.cut,true);
  card.addEventListener('pointerdown',onDown);
  card.addEventListener('pointermove',onMove);
  card.addEventListener('pointerup',onUp);
  card.addEventListener('pointercancel',onCancel);
 });
}
function display(){clearTimeout(transitionTimer);success=false;selected=null;dragging=null;ghost.style.display='none';zone.classList.remove('ready');good.classList.remove('show');end.classList.remove('show');
 document.getElementById('counter').textContent=(index+1)+' / '+LESSONS.length;
 drawAssembly(false);createOptions();}
function pick(card){selected=card.dataset.key;row.querySelectorAll('.choice').forEach(el=>el.classList.toggle('active',el===card));}
function onDown(e){if(success||dragging)return;e.preventDefault();const card=e.currentTarget,r=card.getBoundingClientRect();pick(card);
 dragging={card,id:e.pointerId,startX:e.clientX,startY:e.clientY,xOff:e.clientX-r.left,yOff:e.clientY-r.top,width:r.width,height:r.height};
 card.setPointerCapture(e.pointerId);const floatingCanvas=ghost.querySelector('canvas');drawPiece(floatingCanvas,imgs[card.dataset.key],LESSONS[index].cut,true);
 ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.display='block';updateGhost(e.clientX,e.clientY);
}
function updateGhost(x,y){if(!dragging)return;ghost.style.left=(x-dragging.xOff)+'px';ghost.style.top=(y-dragging.yOff)+'px';}
function onMove(e){if(!dragging||e.pointerId!==dragging.id)return;e.preventDefault();updateGhost(e.clientX,e.clientY);zone.classList.toggle('ready',nearZone(e.clientX,e.clientY));}
function nearZone(x,y){const r=zone.getBoundingClientRect(),pad=Math.min(120,r.width*.22);return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;}
function onUp(e){if(!dragging||e.pointerId!==dragging.id)return;e.preventDefault();const state=dragging;dragging=null;ghost.style.display='none';zone.classList.remove('ready');
 // Press-and-release also selects the piece; tapping the empty target after selection is supported.
 if(nearZone(e.clientX,e.clientY)){tryComplete(state.card.dataset.key);}else{pick(state.card);}
}
function onCancel(){dragging=null;ghost.style.display='none';zone.classList.remove('ready');}
zone.addEventListener('pointerup',()=>{if(selected&&!success)tryComplete(selected);});
function tryComplete(key){if(key!==LESSONS[index].key){row.querySelectorAll('.choice').forEach(e=>e.classList.remove('active'));selected=null;return;}
 success=true;selected=null;row.querySelectorAll('.choice').forEach(e=>e.classList.remove('active'));drawAssembly(true);good.classList.add('show');zone.classList.add('ready');playChime();
 transitionTimer=setTimeout(()=>{if(index<LESSONS.length-1){index++;display();}else{end.classList.add('show');}},1450);
}
function playChime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((freq,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(a.destination);const t=a.currentTime+i*.12;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.29);});setTimeout(()=>a.close(),1100);}catch(e){}}
function navigate(delta){index=Math.max(0,Math.min(LESSONS.length-1,index+delta));display();}
document.getElementById('prev').onclick=()=>navigate(-1);
document.getElementById('next').onclick=()=>navigate(1);
document.getElementById('again').onclick=()=>{index=0;display();};
let loaded=0;Object.entries(EMBED_IMAGES).forEach(([key,src])=>{const im=new Image();imgs[key]=im;im.onload=()=>{loaded++;if(loaded===Object.keys(EMBED_IMAGES).length)display();};im.onerror=()=>{loaded++;if(loaded===Object.keys(EMBED_IMAGES).length)display();};im.src=src;});
</script></body></html>
