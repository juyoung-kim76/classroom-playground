const names=[['얼음 세 조각','얼음이 녹아 생긴 물'],['그릇에 가득한 거품','조금 남은 거품'],['물속에 퍼지기 시작한 색소','고르게 파래진 물'],['도화지에 색연필로 그림을 그리려는 손','도화지에 완성한 그림'],['숟가락을 들고 밥을 먹기 시작하는 모습','밥을 깨끗이 다 먹은 빈 식판'],['씻기 전 흙이 묻은 손','씻고 난 깨끗한 손']];
const $=id=>document.getElementById(id);
const scene=$('scene'),kind=$('kind'),duration=$('duration'),clock=$('clock'),tray=$('tray');
for(let s=30;s<=300;s+=30){let m=Math.floor(s/60),half=s%60;duration.add(new Option([m&&m+'분',half&&half+'초'].filter(Boolean).join(' '),s))}
let stage, selected, frame, started, base,drag;
const timeText=s=>[Math.floor(s/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');
function cleanDrag(){if(drag?.ghost)drag.ghost.remove();drag=null}
function resetBoard(){cancelAnimationFrame(frame);cleanDrag();stage=0;selected=null;base=Date.now();render()}
function photo(side){let img=new Image();img.src=photos[scene.selectedIndex][side];img.alt=names[scene.selectedIndex][side];img.draggable=false;return img}
function drawClock(p){const mode=kind.selectedIndex,total=Number(duration.value),remaining=Math.ceil(total*(1-p));
let visual='';
if(mode===0){
const y=22+60*(1-Math.sqrt(1-p)),low=143-59*Math.sqrt(p);
visual='<svg viewBox="0 0 120 166" aria-hidden="true"><defs><clipPath id="glass"><path d="M17 18 H103 Q102 48 64 81 Q61 84 65 88 Q104 119 103 148 H17 Q16 120 55 88 Q59 84 56 81 Q18 49 17 18Z"/></clipPath></defs><g clip-path="url(#glass)"><rect width="120" height="166" fill="#e9f3f4"/><rect x="0" y="'+y+'" width="120" height="'+Math.max(0,82-y)+'" fill="#e6a642"/><rect x="0" y="'+low+'" width="120" height="'+(p?150-low:0)+'" fill="#e6a642"/>'+(stage===2?'<path d="M60 81 V'+low+'" stroke="#da982f" stroke-width="2" stroke-dasharray="4 3"><animate attributeName="stroke-dashoffset" from="7" to="0" dur=".22s" repeatCount="indefinite"/></path>':'')+'</g><path d="M17 18 H103 Q102 48 64 81 Q61 84 65 88 Q104 119 103 148 H17 Q16 120 55 88 Q59 84 56 81 Q18 49 17 18Z" fill="none" stroke="#547371" stroke-width="3"/><path d="M13 14H107 M13 152H107" stroke="#536558" stroke-width="10" stroke-linecap="round"/></svg>';
}else if(mode===1){visual='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="39" fill="none" stroke="#e1eae3" stroke-width="13"/><circle cx="50" cy="50" r="39" fill="none" stroke="#358071" stroke-width="13" pathLength="100" stroke-dasharray="'+(100*(1-p))+' 100" transform="rotate(-90 50 50)"/></svg>'}
const t=new Date(base+Math.floor(total*p)*1000),digits=mode===2?[t.getHours(),t.getMinutes(),t.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'):timeText(remaining);
clock.innerHTML=visual+'<span class="digits" style="'+(mode===2?'font-size:clamp(17px,2.6vw,40px)':'')+'">'+digits+'</span><small>'+(['', '눌러서 시작','흐르는 중','시간이 됐어요','시간이 됐어요'][stage])+'</small>'}
function render(){selected=null;const lines=['지금 사진을 놓아요','가운데 시계를 눌러요','시간이 흘러요','다음 모습을 찾아 놓아요','어떻게 달라졌나요?'];$('message').textContent=lines[stage];
for(const [i,id] of ['now','next'].entries()){const slot=$(id),filled=i===0?stage>0:stage===4,active=i===0?stage===0:stage===3;slot.disabled=!active;slot.classList.toggle('active',active);slot.replaceChildren();if(filled)slot.append(photo(i));else slot.innerHTML='<span class="insert">＋</span>'}
clock.disabled=stage!==1;clock.classList.toggle('ready',stage===1);drawClock(stage>=3?1:0);tray.replaceChildren();
const cards=stage===0?[0]:stage===3?(Math.random()<.5?[0,1]:[1,0]):[];
for(const side of cards){const b=document.createElement('button');b.className='card';b.append(photo(side));b.onclick=()=>choose(b,side);b.onpointerdown=e=>beginDrag(e,b,side);tray.append(b)}
if(stage===4){const b=document.createElement('button');b.className='reset';b.textContent='한 번 더';b.onclick=resetBoard;tray.append(b)}}
function choose(b,side){tray.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c===b));selected=side;$('message').textContent=(stage===0?'지금':'다음')+' 칸을 눌러요'}
function place(id,side){if(side===null||!((stage===0&&id==='now')||(stage===3&&id==='next')))return;
if(stage===3&&side!==1){$('message').textContent='달라진 모습을 찾아봐요';return}stage=stage===0?1:4;render()}
function beginDrag(e,b,side){if(!e.isPrimary||e.button!==0)return;cleanDrag();b.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};
b.onpointermove=ev=>{if(!drag||!ev.isPrimary)return;if(!drag.ghost&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>7){drag.ghost=b.cloneNode(true);drag.ghost.classList.add('ghost');document.body.append(drag.ghost)}if(drag.ghost){drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px'}};
b.onpointerup=ev=>{if(!drag||!ev.isPrimary)return;const moved=!!drag.ghost;cleanDrag();if(moved){const slot=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');b.onclick=null;if(slot)place(slot.id,side);setTimeout(()=>b.onclick=()=>choose(b,side),0)}};b.onpointercancel=cleanDrag}
$('now').onclick=()=>place('now',selected);$('next').onclick=()=>place('next',selected);
clock.onclick=()=>{if(stage!==1)return;stage=2;base=Date.now();started=performance.now();render();let last=-1;function tick(){let p=Math.min(1,(performance.now()-started)/(1000*Number(duration.value)));if(p===1){stage=3;render();return}if(performance.now()-last>90){drawClock(p);last=performance.now()}frame=requestAnimationFrame(tick)}tick()};
for(const el of [scene,kind,duration])el.onchange=resetBoard;$('reset').onclick=resetBoard;resetBoard();
</script></html>
