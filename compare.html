<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>큰 수 고르기</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',system-ui,sans-serif;background:linear-gradient(180deg,#f7fcff,#ecf4fa);color:#285172;min-height:100vh;display:flex;flex-direction:column}button,select{font:inherit}button{cursor:pointer}header{padding:13px 23px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(22px,3vw,34px);margin:0;font-weight:900}.settings{display:flex;align-items:center;gap:10px}.settings label{font-weight:800}.settings select,.settings button{font-size:17px;border:2px solid #d4e5f0;border-radius:13px;padding:8px 13px;background:white;color:#285172}.settings button{font-weight:800}.play{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:15px;padding:5px max(12px,3vw) 25px}.instruction{text-align:center;font-size:clamp(25px,4.6vw,44px);font-weight:900;color:#285f8c;min-height:62px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,24px);height:min(50vh,480px);min-height:280px}.choose{border:5px solid #d7e4ed;background:#fff;border-radius:28px;box-shadow:0 9px 0 #cddce7;display:flex;justify-content:center;align-items:center;flex-direction:column;padding:12px;position:relative;overflow:hidden;touch-action:manipulation;transition:.12s}.choose:active{transform:translateY(5px);box-shadow:0 3px 0 #cddce7}.choose.correct{border-color:#54b883;background:#f0fcf3}.choose.wrong{border-color:#ed9a9e;background:#fff4f5}.pictures{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(3px,1vw,13px);align-content:center;justify-items:center;width:100%;max-width:480px}.object{width:min(6.5vw,67px);height:min(6.5vw,67px);min-width:31px;min-height:31px}.number{font-size:clamp(44px,7vw,85px);font-weight:900;line-height:1.1;margin-top:12px;color:#34536e}.teacher{display:flex;justify-content:center;align-items:center;gap:15px;flex-wrap:wrap;padding-bottom:6px}.hint{color:#758e9f;font-size:15px}.next{border:0;background:#2d77b0;color:#fff;border-radius:16px;padding:12px 27px;min-height:50px;font-weight:900;font-size:21px}.next:disabled{opacity:.45}.feedback{text-align:center;height:38px;font-size:25px;color:#438d5e;font-weight:900}.icon{width:100%;height:100%}@media(max-width:700px){header{padding:10px}.compare{min-height:240px;height:45vh}.play{padding:8px 10px 16px}.pictures{grid-template-columns:repeat(3,1fr)}.object{min-width:26px;min-height:26px;width:8vw;height:8vw}.number{font-size:45px}}@media(max-height:580px){.compare{height:40vh;min-height:190px}.instruction{font-size:23px;min-height:34px}.feedback{height:24px}.number{font-size:43px}}
</style></head><body><header><h1>🔢 큰 수 고르기</h1><div class="settings"><label for="range">범위</label><select id="range"><option value="5">1~5</option><option value="10">1~10</option></select><button id="numbersBtn">숫자 숨기기</button></div></header><main class="play"><div class="instruction">더 많은 쪽을 눌러요!</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="compare"><button class="choose" id="a" aria-label="첫 번째 그림 묶음"><div class="pictures"></div><div class="number"></div></button><button class="choose" id="b" aria-label="두 번째 그림 묶음"><div class="pictures"></div><div class="number"></div></button></div><div class="teacher"><span id="count" class="hint">1번 문제</span><button id="next" class="next">다음 문제 →</button></div></main><script>
let max=5,show=true,a,b,index=0,done=false;const colors=['#faaf75','#8fcbb1','#a5bce9','#f4a8bb'];
function item(color){return `<svg class="icon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M30 12C14 5 6 20 8 33c2 19 15 22 22 19 10 5 22-2 24-19 3-13-7-25-24-21Z" fill="${color}" stroke="#547385" stroke-width="2"/><path d="M30 15V6M30 10Q42 2 47 9Q41 16 30 15" fill="#6ca979" stroke="#527f5d" stroke-width="2"/><circle cx="23" cy="31" r="2.6" fill="#fff"/><circle cx="37" cy="31" r="2.6" fill="#fff"/></svg>`}
function newQ(){done=false;index++;a=1+Math.floor(Math.random()*max);do{b=1+Math.floor(Math.random()*max)}while(b===a);if(Math.random()<.5)[a,b]=[b,a];const color=colors[index%colors.length];for(const [id,n] of [['a',a],['b',b]]){const el=document.getElementById(id);el.className='choose';el.querySelector('.pictures').innerHTML=Array.from({length:n},()=>`<div class="object">${item(color)}</div>`).join('');el.querySelector('.number').textContent=show?n:'';el.setAttribute('aria-label',`${n}개 그림`)}document.getElementById('feedback').textContent='';document.getElementById('count').textContent=`${index}번 문제`;}
function choose(which){if(done)return;const correct=which==='a'?a>b:b>a;const el=document.getElementById(which);el.classList.add(correct?'correct':'wrong');document.getElementById('feedback').textContent=correct?'참 잘했어요! ★':'한번 더 살펴봐요';if(correct)done=true;else setTimeout(()=>{if(!done)el.classList.remove('wrong')},650)}
for(let id of ['a','b'])document.getElementById(id).addEventListener('click',()=>choose(id));document.getElementById('next').addEventListener('click',newQ);document.getElementById('range').addEventListener('change',e=>{max=+e.target.value;index=0;newQ()});document.getElementById('numbersBtn').addEventListener('click',e=>{show=!show;e.target.textContent=show?'숫자 숨기기':'숫자 보이기';newQ()});newQ();
</script></body></html>
