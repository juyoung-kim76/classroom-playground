<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공통 자료 연동 시험</title>
<style>body{font-family:'Malgun Gothic',sans-serif;background:#f0f7ff;display:grid;place-items:center;min-height:100vh;margin:0;color:#244260}main{text-align:center;width:min(95%,900px)}h1{font-size:clamp(26px,4vw,44px)}.choices{display:flex;gap:24px;justify-content:center;margin-top:30px}.number{font-size:clamp(70px,10vw,150px);font-weight:900;border:6px solid #bed4e5;border-radius:25px;background:white;color:#255b88;min-width:36%;padding:20px 5px;cursor:pointer}.number:active{transform:scale(.95)}#message{font-size:clamp(20px,3vw,32px);font-weight:800;margin:30px}.next{border:0;border-radius:20px;background:#276c91;color:white;font-size:23px;padding:17px 35px;cursor:pointer}</style>
</head><body><main><h1>🔢 더 큰 수를 찾아요!</h1><p>공통 자료 연동 시험 게임</p><div class="choices"><button class="number" id="a">2</button><button class="number" id="b">5</button></div><div id="message" aria-live="polite">어느 수가 더 클까요?</div><button class="next" id="next">↻ 새 문제</button></main><script>let nums=[];function next(){let a=1+Math.floor(Math.random()*9),b;do{b=1+Math.floor(Math.random()*9)}while(a===b);nums=[a,b];document.getElementById('a').textContent=a;document.getElementById('b').textContent=b;document.getElementById('message').textContent='어느 수가 더 클까요?'}for(let i=0;i<2;i++)document.getElementById(i?'b':'a').onclick=()=>{document.getElementById('message').textContent=nums[i]===Math.max(...nums)?'🎉 잘했어요!':'다시 살펴보아요 😊'};document.getElementById('next').onclick=next;next()</script></body></html>
