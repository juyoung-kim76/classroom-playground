<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>우리 반 학습 놀이터</title><meta name="theme-color" content="#285f8c"><meta name="description" content="우리 반 수학·즐생 전자칠판 활동">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icons/app-192.png">
<style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color:#183650;background:#f5f8fc}*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #e8a950;outline-offset:2px}
.shell{max-width:1190px;margin:auto;padding:26px 28px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:17px}.logo{width:66px;height:66px;border-radius:18px;background:#285f8c;display:grid;place-items:center;box-shadow:0 5px 14px #275c8530}.logo svg{width:43px;height:43px}.brand h1{font-size:clamp(26px,3.3vw,42px);margin:0;letter-spacing:-1.1px;color:#174269}.brand p{margin:5px 0 0;color:#607789;font-size:15px}.status{display:flex;align-items:center;gap:9px;min-height:40px;padding:8px 13px;border-radius:30px;background:#e5f4e9;color:#2e7851;font-size:14px;font-weight:700}.status.offline{background:#fff2df;color:#99631c}.status i{width:9px;height:9px;border-radius:50%;background:currentColor}
.tabs{display:flex;background:#e9eff4;padding:7px;border-radius:22px;gap:8px;margin:24px 0 22px}.tab{border:0;background:transparent;flex:1;padding:16px 12px;font-size:clamp(20px,2.1vw,27px);font-weight:800;border-radius:17px;color:#5a7083;transition:background .16s}.tab.active{background:#fff;color:#174c79;box-shadow:0 3px 11px #31557218}.tab .tabicon{font-size:27px;vertical-align:-2px;margin-right:8px}
.sectiontitle{display:flex;justify-content:space-between;align-items:end;margin:0 0 18px;gap:10px}.sectiontitle h2{font-size:23px;margin:0;color:#244c70}.sectiontitle small{font-size:14px;color:#788b9a}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.activity{display:flex;align-items:center;text-align:left;border:2px solid #e0e8ee;background:#fff;min-height:135px;padding:18px;gap:16px;border-radius:22px;box-shadow:0 5px 13px #273f5520;transition:transform .13s,box-shadow .13s}.activity:hover{transform:translateY(-2px);box-shadow:0 8px 20px #273f5524}.art{width:74px;height:74px;flex:none;border-radius:19px;display:grid;place-items:center;background:#e8f0ff}.art svg{width:47px;height:47px}.activity[data-color="mint"] .art{background:#ddf4eb}.activity[data-color="yellow"] .art{background:#fff1cc}.activity[data-color="pink"] .art{background:#ffe5ec}.activity[data-color="purple"] .art{background:#ede3ff}.activity[data-color="blue"] .art{background:#e0efff}.name{font-size:19px;font-weight:850;color:#1a3c5b;line-height:1.3}.detail{font-size:13px;line-height:1.5;color:#758998;margin-top:7px}.new{display:inline-block;margin-top:6px;background:#dff3e6;color:#2b7757;font-size:11px;border-radius:20px;padding:3px 9px;font-weight:800}.empty{padding:50px 20px;text-align:center;background:white;border:2px dashed #c9d7e2;border-radius:20px;color:#607687;font-size:18px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:28px;color:#6e8292;font-size:14px}.softbtn{background:#fff;border:2px solid #d2dee8;color:#244a67;padding:12px 19px;font-size:15px;font-weight:800;border-radius:15px;min-height:49px}.softbtn:hover{background:#f6fafd}.viewer{position:fixed;inset:0;background:#f5f8fc;z-index:10;display:flex;flex-direction:column}.viewbar{height:62px;background:#fff;border-bottom:1px solid #d7e2ea;flex:none;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:7px 13px}.viewbar .title{font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.leftcontrols,.rightcontrols{display:flex;gap:9px;align-items:center}.viewbtn{border:0;border-radius:11px;background:#e7f0f8;padding:11px 16px;font-weight:800;color:#285777;white-space:nowrap;min-height:44px}.viewbtn.primary{background:#235f90;color:#fff}.viewer iframe{border:0;flex:1;width:100%;background:white}.hidden{display:none!important}
@media(max-width:930px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.activity{min-height:116px}.shell{padding:18px}}@media(max-width:580px){.cards{grid-template-columns:1fr}.brand h1{font-size:24px}.brand p{display:none}.logo{width:46px;height:46px;border-radius:13px}.logo svg{width:29px}.top{gap:6px}.status{font-size:12px;padding:8px}.tab{padding:14px 5px}.activity{min-height:90px}.art{height:60px;width:60px}.art svg{width:38px;height:38px}.foot{flex-wrap:wrap}.sectiontitle h2{font-size:18px}.viewbar .title{font-size:15px}.viewbtn{padding:10px;font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="home" class="shell"><header class="top"><div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 52 52"><rect x="3" y="3" width="21" height="21" rx="5" fill="#FFCF70"/><circle cx="39" cy="14" r="11" fill="#9be2d5"/><path d="M15 29L3 50H27Z" fill="#f4a9a0"/><rect x="30" y="30" width="19" height="20" rx="5" fill="#d7cafa"/></svg></div><div><h1>우리 반 학습 놀이터</h1><p>전자칠판에서 만지고 배우는 즐거운 시간</p></div></div><div class="status" id="status"><i></i><span id="statusText">활동 준비 완료</span></div></header>
<nav class="tabs" role="tablist" aria-label="교과 선택"><button class="tab active" id="tabMath" role="tab" aria-selected="true" type="button" data-tab="math"><span class="tabicon">▦</span>수학</button><button class="tab" id="tabJoy" role="tab" aria-selected="false" type="button" data-tab="joy"><span class="tabicon">✿</span>즐생</button></nav>
<div class="sectiontitle"><h2 id="sectionName">수학 활동</h2><small id="sectionCount"></small></div><main id="cards" class="cards" aria-live="polite"></main>
<footer class="foot"><span id="footNote">처음에는 수학과 즐생 두 교과로 나누어 사용해요.</span><button id="refresh" class="softbtn" type="button">↻ 새 활동 확인</button></footer></div>
<section id="viewer" class="viewer hidden" aria-label="전자칠판 활동"><div class="viewbar"><div class="leftcontrols"><button type="button" class="viewbtn primary" id="back">← 활동 목록</button><span class="title" id="playingName"></span></div><div class="rightcontrols"><button type="button" class="viewbtn" id="reset">↻ 다시 시작</button><button type="button" class="viewbtn" id="full">⛶ 전체 화면</button></div></div><iframe id="activityFrame" title="학습 활동" allow="fullscreen"></iframe></section>
<script>
'use strict';
const LOCAL_ACTIVITIES=[{"id": "compare", "title": "큰 수 고르기", "detail": "두 수의 크기 비교 · 터치", "subject": "math", "icon": "numbers", "path": "activities/compare.html", "tag": "새 게임"}, {"id": "daynight", "title": "낮과 밤", "detail": "실사 그림 분류하기", "subject": "math", "icon": "sun", "path": "activities/daynight_photo.html"}, {"id": "tangram-new", "title": "탱그램 · 새로운 모양", "detail": "조각을 직접 돌려 맞추기", "subject": "math", "icon": "puzzle", "path": "activities/tangram_new.html"}, {"id": "tangram", "title": "탱그램 · 기본", "detail": "기초 모양 구성하기", "subject": "math", "icon": "puzzle", "path": "activities/tangram_original.html"}, {"id": "half", "title": "반쪽 그림 찾기", "detail": "그림 완성하기", "subject": "math", "icon": "butterfly", "path": "activities/half_picture.html"}, {"id": "hourglass", "title": "모래시계", "detail": "시간의 흐름 · 초 소리", "subject": "math", "icon": "hourglass", "path": "activities/hourglass.html"}, {"id": "big-sheet", "title": "큰 수 찾기 활동지", "detail": "무작위 문제 · 인쇄", "subject": "math", "icon": "print", "path": "activities/big_number_sheet.html"}, {"id": "order-sheet", "title": "수의 순서 활동지", "detail": "순서 문제 만들기", "subject": "math", "icon": "order", "path": "activities/number_order_sheet.html"}, {"id": "daynight-alt", "title": "낮과 밤 · 다른 그림", "detail": "예전 그림 버전", "subject": "math", "icon": "moon", "path": "activities/daynight_illustrated.html"}, {"id": "leaf-boat", "title": "나뭇잎 배 놀이", "detail": "잎을 물에 띄워요", "subject": "joy", "icon": "leaf", "path": "activities/leaf_boat.html", "tag": "새 게임"}, {"id": "summer-forest", "title": "교실 속 여름 숲", "detail": "자연물로 숲 꾸미기", "subject": "joy", "icon": "tree", "path": "activities/summer_forest.html", "tag": "새 게임"}];
const $=id=>document.getElementById(id);
let all=LOCAL_ACTIVITIES,tab='math',openId=null;
const palette=['yellow','blue','purple','mint','pink'];
const ICONS={
 numbers:'<text x="11" y="52" font-size="49" font-weight="900" fill="#33689c">1</text><text x="43" y="52" font-size="49" font-weight="900" fill="#ef9b56">5</text>',
 sun:'<circle cx="32" cy="32" r="19" fill="#ffd56c"/><path d="M32 4v7M32 53v7M4 32h7M53 32h7M12 12l5 5M47 47l5 5M52 12l-5 5M12 52l5-5" stroke="#e9a73f" stroke-width="4" stroke-linecap="round"/>',
 moon:'<path d="M39 10A24 24 0 1 0 54 49 25 25 0 0 1 39 10Z" fill="#8f99d8"/><circle cx="46" cy="16" r="3" fill="#f1c86b"/>',
 puzzle:'<path d="M6 8h24v21H6z" fill="#83cbbe"/><path d="M35 8L60 29H35Z" fill="#ffce7a"/><path d="M8 34L31 59H8Z" fill="#f6a4a2"/><rect x="34" y="34" width="24" height="24" rx="4" fill="#a8a1df"/>',
 butterfly:'<path d="M30 34C5-4-3 28 19 42 3 60 25 66 31 43" fill="#fbabbb"/><path d="M34 34C58-4 68 30 44 42 62 58 42 65 33 43" fill="#9fcbf2"/><path d="M32 29v24" stroke="#5c5b65" stroke-width="5" stroke-linecap="round"/>',
 hourglass:'<path d="M15 5h34v8L36 31l13 19v9H15v-9l13-19-13-18Z" fill="#fff" stroke="#6293bd" stroke-width="5"/><path d="M20 52l12-13 12 13Z" fill="#efc66d"/><path d="M20 14h24l-12 14Z" fill="#efc66d"/>',
 print:'<rect x="16" y="3" width="32" height="25" rx="3" fill="#c7e5f4"/><rect x="8" y="22" width="48" height="26" rx="6" fill="#7ea8ce"/><rect x="16" y="38" width="32" height="22" fill="#fff"/><path d="M22 46h20M22 53h17" stroke="#7ea8ce" stroke-width="3"/>',
 order:'<rect x="3" y="13" width="18" height="34" rx="5" fill="#f4b96c"/><rect x="24" y="13" width="18" height="34" rx="5" fill="#9bdac8"/><rect x="45" y="13" width="16" height="34" rx="5" fill="#a0bee5"/><g fill="#fff" font-size="22" font-weight="800" text-anchor="middle"><text x="12" y="36">1</text><text x="33" y="36">2</text><text x="53" y="36">3</text></g>',
 leaf:'<path d="M12 41Q13 5 55 9Q57 47 17 52" fill="#79bd7e" stroke="#57945e" stroke-width="3"/><path d="M9 58L48 20" stroke="#518a52" stroke-width="4"/>',
 tree:'<path d="M27 32h10v27H27Z" fill="#a57d56"/><circle cx="19" cy="29" r="15" fill="#99d39a"/><circle cx="40" cy="28" r="18" fill="#6cb17c"/><circle cx="30" cy="16" r="18" fill="#82c48e"/>'
};
function svgFor(t){return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[t]||ICONS.puzzle}</svg>`}
function setTab(t){tab=t;for(const el of document.querySelectorAll('.tab')){const active=el.dataset.tab===t;el.classList.toggle('active',active);el.setAttribute('aria-selected',active?'true':'false')};$('sectionName').textContent=t==='math'?'수학 활동':'즐생 활동';render()}
function render(){const found=all.filter(x=>x.subject===tab);$('sectionCount').textContent=`${found.length}개 활동`;$('cards').replaceChildren();if(!found.length){$('cards').innerHTML='<div class="empty">이 교과의 활동은 곧 추가할 수 있어요.</div>';return}for(const [i,x] of found.entries()){const b=document.createElement('button');b.type='button';b.className='activity';b.dataset.color=palette[i%palette.length];b.innerHTML=`<span class="art">${svgFor(x.icon)}</span><span class="copy"><span class="name"></span><div class="detail"></div>${x.tag?'<span class="new">'+x.tag+'</span>':''}</span>`;b.querySelector('.name').textContent=x.title;b.querySelector('.detail').textContent=x.detail;b.addEventListener('click',()=>openActivity(x.id));$('cards').append(b)}}
function openActivity(id){const x=all.find(a=>a.id===id);if(!x)return;openId=id;$('playingName').textContent=x.title;$('home').classList.add('hidden');$('viewer').classList.remove('hidden');$('activityFrame').src=x.path;history.replaceState(null,'','#'+encodeURIComponent(id))}
function closeActivity(){openId=null;$('activityFrame').src='about:blank';$('viewer').classList.add('hidden');$('home').classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function getStatus(s,offline=false){$('statusText').textContent=s;$('status').classList.toggle('offline',offline)}
async function refreshActivities(showMessage=false){
 // file:// 동작 시에는 내장 목록으로 열립니다. 웹에 게시하면 새 자료 목록을 받아옵니다.
 if(location.protocol==='file:'){getStatus('교실용 · 저장된 활동',true);if(showMessage)alert('지금은 컴퓨터에서 실행 중이에요. 교실 자동 연동은 앱을 온라인에 등록하면 시작됩니다.');return}
 if(!navigator.onLine){getStatus('오프라인 · 저장된 활동',true);return}
 try{const r=await fetch('activities.json?check='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const info=await r.json();if(!Array.isArray(info.activities))throw Error('invalid data');all=info.activities.filter(x=>x.id&&x.title&&['math','joy'].includes(x.subject)&&x.path&&/^activities\/[a-zA-Z0-9_-]+\.html$/.test(x.path));render();getStatus('최신 활동 확인 완료');if(showMessage)alert('활동 목록을 새로 확인했어요!')}catch(e){getStatus('저장된 활동 사용 중',true);if(showMessage)alert('새 활동을 받을 수 없어 기존 활동을 사용합니다.')}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('back').addEventListener('click',closeActivity);
$('reset').addEventListener('click',()=>{if(openId){const x=all.find(a=>a.id===openId);if(x)$('activityFrame').src=x.path}});
$('full').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else{(document.getElementById('viewer').requestFullscreen?.()||Promise.resolve()).catch(()=>{})}});
$('refresh').addEventListener('click',()=>refreshActivities(true));
window.addEventListener('online',()=>refreshActivities());window.addEventListener('offline',()=>getStatus('오프라인 · 저장된 활동',true));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.fullscreenElement&&openId)closeActivity()});
setTab('math');refreshActivities();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
